[package]
name = "leptos-csr-example"
version = "0.1.0"
edition = "2024"
description = "Leptos 0.8 client-side app showing rx-leptos bridges"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
leptos = {version = "0.8", features = ["csr"]}
rx-leptos = {path = "../.."}
rxrust = {git = "https://github.com/Dev916/rxRust", branch = "master"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = {version = "0.3", features = ["Document", "EventTarget", "MouseEvent", "Response", "Window"]}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = {version = "0.3", features = ["wasm-bindgen"]}
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
any_spawner = {version = "0.3", features = ["tokio"]}
reactive_graph = "0.2"
tokio = {version = "1", features = ["rt", "macros", "time"]}
