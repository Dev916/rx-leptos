[package]
name = "rx-leptos"
version = "0.1.0"
edition = "2024"
description = "Bridges between rxRust observables and Leptos 0.8 signals"
license = "MIT"
repository = "https://github.com/Dev916/rx-leptos"
keywords = ["rx", "reactivex", "leptos", "signals", "frp"]
categories = ["asynchronous", "web-programming"]
publish = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
any_spawner = "0.3"
reactive_graph = "0.2"
rxrust = {git = "https://github.com/Dev916/rxRust", branch = "master", default-features = false, features = ["scheduler"]}
send_wrapper = "0.6"

[dev-dependencies]
any_spawner = {version = "0.3", features = ["futures-executor"]}
leptos_server = {version = "0.8", default-features = false}

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = {version = "0.3", features = ["AbortController", "AbortSignal", "Event", "EventTarget", "RequestInit", "Response"]}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# The CSR example builds alongside the crate; the SSR example is its own
# workspace because Leptos `csr` and `ssr` features must not unify.
[workspace]
members = ["examples/leptos-csr"]
exclude = ["examples/leptos-ssr"]
